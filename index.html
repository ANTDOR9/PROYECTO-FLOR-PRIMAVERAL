<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Flor Primaveral</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Rubik:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <canvas id="c"></canvas>

  <!-- estrella reutilizable (destellos del intro) -->
  <svg width="0" height="0" style="position:absolute"><symbol id="star" viewBox="0 0 512 512">
    <path d="M512 255.1c0 11.34-7.406 20.86-18.44 23.64l-171.3 42.78l-42.78 171.1C276.7 504.6 267.2 512 255.9 512s-20.84-7.406-23.62-18.44l-42.66-171.2L18.47 279.6C7.406 276.8 0 267.3 0 255.1c0-11.34 7.406-20.83 18.44-23.61l171.2-42.78l42.78-171.1C235.2 7.406 244.7 0 256 0s20.84 7.406 23.62 18.44l42.78 171.2l171.2 42.78C504.6 235.2 512 244.6 512 255.1z"/>
  </symbol></svg>

  <!-- INTRO: mensaje "magic text" -->
  <div id="intro">
    <h1 class="magic">
      <span class="line">Un regalito para usted</span>
      <i class="spark" style="top:6%;  left:12%; animation-delay:.0s"><svg><use href="#star"/></svg></i>
      <i class="spark" style="top:0%;  right:16%; animation-delay:.5s"><svg><use href="#star"/></svg></i>
      <i class="spark" style="bottom:8%;left:6%;  animation-delay:.9s"><svg><use href="#star"/></svg></i>
      <i class="spark" style="bottom:2%;right:10%; animation-delay:1.3s"><svg><use href="#star"/></svg></i>
      <i class="spark" style="top:40%; left:-2%; animation-delay:.7s"><svg><use href="#star"/></svg></i>
      <i class="spark" style="top:36%; right:-2%;animation-delay:1.1s"><svg><use href="#star"/></svg></i>
    </h1>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
