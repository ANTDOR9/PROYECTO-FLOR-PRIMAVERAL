<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Flor Primaveral</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ===================== ESCENAS ===================== -->
  <main class="scenes" id="scenes">

    <!-- ESCENA 0: solo la lámpara centrada (fondo negro) -->
    <section class="scene active" data-scene="0"></section>

    <!-- ESCENA 1: composición floral (cabeza arriba + polen abajo) -->
    <section class="scene" data-scene="1">
      <canvas class="bloom" id="bloom"></canvas>
    </section>

  </main>

  <!-- pista -->
  <p class="hint" id="hint">jala el cordón ↓</p>

  <!-- ===================== LÁMPARA (centrada) ===================== -->
  <div class="lamp-zone" aria-hidden="true">
    <svg class="lamp" id="lamp" viewBox="0 0 150 210" fill="none" xmlns="http://www.w3.org/2000/svg">
      <ellipse class="bulb-glow" cx="75" cy="70" rx="95" ry="85" fill="url(#g)"/>
      <defs>
        <radialGradient id="g" cx="50%" cy="50%" r="50%">
          <stop offset="0%"  stop-color="#fff0c8" stop-opacity="0.95"/>
          <stop offset="45%" stop-color="#ffb64a" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="#ffb64a" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#efe7d6"/>
          <stop offset="100%" stop-color="#b9a684"/>
        </linearGradient>
      </defs>
      <path d="M15 78 C15 30 135 30 135 78 Z" fill="url(#shade)"/>
      <rect x="70" y="78" width="10" height="14" rx="3" fill="#9c8b6e"/>
      <rect x="72" y="90" width="6" height="86" rx="3" fill="#7d6f58"/>
      <ellipse cx="75" cy="182" rx="34" ry="9" fill="#5a4f3d"/>
      <ellipse cx="75" cy="179" rx="34" ry="9" fill="#7a6c54"/>
    </svg>
  </div>

  <!-- canvas del cordón -->
  <canvas id="ropeCanvas" aria-hidden="true"></canvas>

  <!-- destello de transición -->
  <div id="flash" aria-hidden="true"></div>

  <script src="js/main.js"></script>
</body>
</html>
